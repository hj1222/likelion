<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact info edit</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container2">
        <div class="arrow">
            <a href="./account.html" type="button">
                <img src="../assets/src/Vector.png" alt="">
            </a>
        </div>
        <p id="contactinfo_title">Contact info</p>
        <div class="info"></div>
        <img src="../assets/src/profile.png" alt="" id="info_profile">
        <img src="../assets/src/edit.png" alt="" id="info_edit">
        <div class="infoedit">
            <div id="edit">
                <p>Name</p>
                <input type="text" placeholder="Warren Buffet">
                <button>Change</button>
            </div>
            <div id="edit">
                <p>Birthdate</p>
                <input type="text" placeholder="05 November 1993">
                <button>Change</button>
            </div>
            <div id="edit">
                <p>Gender</p>
                <input type="text" placeholder="Male">
                <button>Change</button>
            </div>
            <div id="edit">
                <p>Email</p>
                <input type="text" placeholder="warren.buff@invest.ai">
                <button>Change</button>
            </div>
            <div id="edit">
                <p>Phone Number</p>
                <input type="text" placeholder="-">
                <button>Change</button>
            </div>
            <div id="editAddress">
                <p>Address</p>
                <input type="text" placeholder="-">
                <button>Change</button>
            </div>
        </div>
    </div>
</body>
</html>
